name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: creator, POSTGRES_PASSWORD: creator, POSTGRES_DB: creator_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U creator" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { MODEL_CACHE: /tmp/models }   # the AI-voice test downloads one pinned voice (SHA-256 checked) on first use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/cache@v4
        with: { path: /tmp/models, key: "voice-models-${{ hashFiles('backend/app/speech/models.lock.json') }}" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
  real-models:
    # Pinned self-hosted models for real (Whisper, Argos, Kokoro/Piper voices incl. Hindi, multilingual dub through the API), offline.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: creator, POSTGRES_PASSWORD: creator, POSTGRES_DB: creator_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U creator" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { REAL_MODELS: "1", MODEL_CACHE: /tmp/models, WHISPER_MODEL: small, DUB_SOURCES: "en,hi,es", DUB_TARGETS: "en,hi,es,de" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/cache@v4
        with: { path: /tmp/models, key: "pinned-models-${{ hashFiles('backend/app/speech/models.lock.json') }}" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m app.speech.assets prefetch          # download + SHA-256 check (pinned in models.lock.json)
      - run: python -m app.speech.assets verify            # load every model, one inference each, with downloads forbidden
        env: { MODELS_OFFLINE: "1", HF_HUB_OFFLINE: "1" }
      - run: python -m pytest -q -s tests/test_real_models.py
        env: { MODELS_OFFLINE: "1", HF_HUB_OFFLINE: "1" }
  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t creator-universe:ci .
      - run: docker run --rm creator-universe:ci python -c "import app.main, app.worker; print('image ok')"
