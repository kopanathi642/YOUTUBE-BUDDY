# Render Blueprint — one click creates the web app, the background render worker and Postgres.
# Media lives in Cloudflare R2 (private bucket). Secrets are entered in the Render dashboard, never committed.
databases:
  - name: creator-db
    plan: basic-256mb
    region: singapore          # closest Render region to India
    postgresMajorVersion: "16"

services:
  - type: web
    name: creator-universe-web
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/v1/health
    preDeployCommand: alembic upgrade head   # migrations run as a controlled release step
    autoDeploy: true
    envVars: &shared
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: creator-db, property: connectionString }
      - key: S3_ENDPOINT_URL          # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS             # your public app URL, e.g. https://creator-universe-web.onrender.com
        sync: false
      # Google sign-in via Firebase project "ytbuddy-3". Web config values are public identifiers, not secrets.
      - key: FIREBASE_PROJECT_ID
        value: ytbuddy-3
      - key: FIREBASE_AUTH_DOMAIN
        value: ytbuddy-3.firebaseapp.com
      - key: FIREBASE_API_KEY
        value: AIzaSyBDvbm-e_74r8nxeTVTLB9ON7tEoy0Th_M
      - key: FIREBASE_APP_ID          # copy from Firebase console → Project settings → Your apps (optional)
        sync: false
      - key: OPENAI_API_KEY           # optional: use OpenAI for captions/translation instead of the free models
        sync: false
      - key: FAL_KEY                  # turns on hosted video/image/music/lip-sync/3D models (fal.ai, pay per use)
        sync: false
      - key: ANTHROPIC_API_KEY        # writing + strategy tools (or use OPENAI_API_KEY)
        sync: false
      - key: YOUTUBE_API_KEY          # channel research tools (free Google Cloud API key, YouTube Data API v3)
        sync: false
      - key: AI_DAILY_BUDGET_USD      # safety cap on paid AI spend per workspace per day (USD); 0 switches paid models off
        value: "10"
      - key: AI_DAILY_PAID_RUNS
        value: "200"
      - key: FREE_PLAN_PAID_RUNS
        value: "5"
      - key: ADMIN_EMAILS              # founder Google account(s): set QR + approve UPI payments
        sync: false
      - key: PEXELS_API_KEY            # free stock library
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID    # YouTube publishing (free Google Cloud OAuth client)
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false                    # a Fernet key; must be the same on web + worker (see .env.example)
      - key: SCRATCH_DIR
        value: /tmp/creator-worker

  - type: worker
    name: creator-universe-worker
    runtime: docker
    plan: standard             # 2 GB RAM: FFmpeg renders need headroom
    region: singapore
    dockerCommand: python -m app.worker --queues media,render
    autoDeploy: true
    disk:                      # keeps downloaded AI models (Whisper, voices, translation, U2-Net) across restarts
      name: models
      mountPath: /var/models
      sizeGB: 5
    envVars: *shared
