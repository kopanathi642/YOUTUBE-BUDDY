version: '3.9'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youtube-buddy-backend
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - '8000:8000'
    volumes:
      - ./backend/app:/app/app
      - ./backend:/app
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youtube-buddy-worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/app:/app/app
      - ./backend:/app
  db:
    image: postgres:15
    container_name: youtube-buddy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-youtube_buddy}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: youtube-buddy-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
volumes:
  postgres-data:
